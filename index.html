<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muistipeli</title>
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
    <h1>Muistipeli</h1>
    
    <div id="controls">
        <label for="card-count">Korttien määrä:</label>
        <select id="card-count">
            <option value="4">4</option>
            <option value="8">8</option>
            <option value="12">12</option>
            <option value="16" selected>16</option>
            <option value="20">20</option>
            <option value="24">24</option>
        </select>
        <button id="restart-btn">Aloita alusta</button>
    </div>

    <div id="game-info">
        <p>Yritykset: <span id="attempts">0</span> | Aika: <span id="timer">0</span> s</p>
    </div>
    
    <div id="result"></div>

    <div id="game-board"></div>

    <script type="module" src="./js/game.js?v=2"></script>
</body>
</html>
